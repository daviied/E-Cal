<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CalcVault">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>CalcVault</title>
<link rel="stylesheet" href="/style.css">
<script src="/lib/mathjs.min.js"></script>
<script src="/lib/nerdamer/nerdamer.all.min.js"></script>
<script type="importmap">
{"imports": {"mathlive": "/lib/mathlive/mathlive.min.mjs"}}
</script>
</head>
<body>

<div id="login-overlay" class="overlay">
  <form id="login-form" class="login-box">
    <h1>CalcVault</h1>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Log in</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" hidden>
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>CalcVault</h1>
      <div class="sidebar-header-buttons">
        <button id="btn-logout" title="Log out">Log out</button>
        <button id="btn-sidebar-close" class="icon-btn" title="Hide sidebar" aria-label="Hide sidebar">&#171;</button>
      </div>
    </div>
    <div id="sidebar-actions">
      <button id="btn-new-folder">+ Folder</button>
      <button id="btn-new-calc">+ Calculator</button>
    </div>
    <div id="tree"></div>
  </aside>
  <div id="sidebar-backdrop"></div>

  <main id="main">
    <div id="empty-state">
      <button class="icon-btn" data-sidebar-open title="Show sidebar" aria-label="Show sidebar">&#9776;</button>
      <p>Select a calculator from the sidebar, or create a new one.</p>
    </div>

    <div id="calc-view" class="view" hidden>
      <div class="view-header">
        <button class="icon-btn" data-sidebar-open title="Show sidebar" aria-label="Show sidebar">&#9776;</button>
        <input type="text" id="calc-name" class="name-input">
        <button id="calc-kbd" class="icon-btn" title="Use phone keyboard" aria-label="Use phone keyboard">&#9000;</button>
        <button id="calc-more" class="icon-btn" title="More options" aria-label="More options">&#8943;</button>
        <button id="calc-lock-toggle">Unlocked</button>
        <div class="view-header-secondary">
          <select id="calc-move" title="Move to folder"></select>
          <button id="calc-delete" class="danger">Delete</button>
        </div>
      </div>
      <div class="calc-screen">
        <div id="calc-lines"></div>
        <button id="calc-add-line">+ Add line</button>
      </div>
    </div>

    <div id="keypad" aria-label="Calculator keypad"></div>
  </main>
</div>

<div id="modal-overlay" class="overlay" hidden>
  <div class="modal-box">
    <p id="modal-message"></p>
    <input type="text" id="modal-input">
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-ok" class="primary">OK</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
